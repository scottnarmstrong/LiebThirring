fidelity:
  divergences: >-
    The kinetic operator is -Delta with Fourier phase exp(-2 pi i x.xi).
    The explicit coefficient is (9/35)(6 pi^2)^(2/3) q^(-2/3), with no
    optimality claim. Stability uses charges 0 <= z_k <= Z and a constant
    chosen before N, M, charges, nuclear positions and state. Its main
    formulation is additive in [0,infinity], avoiding subtraction of
    infinities and allowing nuclear collisions. The real form requires
    distinct nuclei and finite kinetic energy and proves all Coulomb
    terms finite. Baxter's theorem has equal charges and includes its
    Z^2/4 correction; unequal-charge screening is proved in the assembly.
    Empty configurations are included. The Coulomb kernel at collision
    is infinity, zero times infinity is zero, and an empty nearest-distance
    infimum is infinity with inverse zero. README.md states every theorem
    and these conventions in mathematical notation.
    Atomic ionization specializes to one static nucleus of arbitrary
    positive real charge; strict binding compares the EReal infima at N
    and truncated-natural N-1, while weak ground states require
    normalized form-domain attainment at a real energy. The thermodynamic
    result uses exact neutrality N=zM, nuclear density M/volume, kinetic
    coefficients 1 and 1/m, bosonic nuclei, and Dirichlet form closure;
    convergence includes density zero. TF uses nonnegative a.e. L1 and
    L^(5/3) classes, the half-weighted direct Coulomb energy and the
    sharp -Delta coefficient (3/5)(6 pi^2/q)^(2/3). Its energy omits
    nuclear repulsion; the total limit adds that constant on both sides.
    The scale is alpha=N/nu, with charges alpha*z, positions
    alpha^(-1/3)*R and energy alpha^(7/3). The total limit requires
    distinct scaled positions at each index. Relaxed minimization
    permits zero mass and coincident nuclei; saturation and exact-mass
    attainment require positive charges and distinct positions. Exact
    and relaxed infima are distinguished, and no minimizer is assumed
    in either molecular quantum limit.

alignment:
  - source: "Frank, Theorem 7; Lundholm, Theorem 7.6"
    lean: "LiebThirring.stability_of_matter"
    note: "Solovej's proof with bounded unequal charges and nonnegative extended additive energies."
  - source: "Frank, Theorem 7; Lundholm, Theorem 7.6"
    lean: "LiebThirring.stability_of_matter_real"
    note: "Real form with Coulomb finiteness from Hardy, finite kinetic energy and distinct nuclei."
  - source: "Frank, Corollary 6; Lundholm, Theorem 6.1 and Corollary 6.8; Rumin, Sections 3.1-3.3"
    lean: "LiebThirring.kinetic_lieb_thirring"
    note: "Three-dimensional N-body spin version with explicit Rumin coefficient."
  - source: "Lundholm, Theorem 7.2"
    lean: "LiebThirring.baxter"
    note: "Equal-charge electrostatic estimate with the positive nearest-other-nucleus correction."
  - source: "Fourier differentiation and Plancherel identities"
    lean: "LiebThirring.kineticEnergy_schwartz"
    note: "Classical Dirichlet integral identification for spin-valued Schwartz functions."
  - source: "Lieb (1984), Theorem 1, (2.9), (2.11), (4.1)-(4.5)"
    lean: "LiebThirring.electron_count_lt_of_atomic_weak_ground_state"
    note: "Atomic unit-charge bound N < 2Z+1 for normalized weak form-domain ground states, with real Z and arbitrary positive spin."
  - source: "Lieb (1984), Theorem 1 and the strict-binding discussion after (2.9)"
    lean: "LiebThirring.electron_count_lt_of_atomic_binding"
    note: "Strict EReal removal binding produces a weak ground state by localization and compactness, then the same atomic bound."
  - source: "Lieb-Lebowitz (1972), Theorems 3.1-3.2, 4.6, 5.1 and 8.1"
    lean: "LiebThirring.exists_unique_thermodynamic_energy_density"
    note: "Screening, packing and renewal adapted to the all-sequence neutral canonical ground-energy limit in Dirichlet balls, including density zero."
  - source: "Lieb-Simon (1977), Theorem III.1, (45); Lieb (1981), Theorem 5.1"
    lean: "LiebThirring.tendsto_electronicGroundStateEnergy_tf"
    note: "Electronic molecular energy, fixed arbitrary positive spin and -Delta kinetic units, every fixed TF mass nu>0, no minimizer premise."
  - source: "Lieb-Simon (1977), Theorem III.1, (45); Lieb (1981), Theorem 5.1"
    lean: "LiebThirring.tendsto_groundStateEnergy_tf"
    note: "Total energy adds nuclear repulsion on both sides; scaled nuclear positions are distinct at every sequence index."
  - source: "Lieb-Simon (1977), Theorem II.14; Lieb (1981), Theorem 2.4"
    lean: "LiebThirring.exists_unique_tfRelaxedMinimizer"
    note: "Unique relaxed minimizer at every nonnegative mass cap; quantitative convexity gives a strong-Cauchy existence proof."
  - source: "Lieb-Simon (1977), Theorems II.17-II.20 and II.32; Lieb (1981), Theorems 2.5 and 3.18"
    lean: "LiebThirring.tfEnergy_saturation_and_attainment"
    note: "Energy saturation at total nuclear charge, exact-mass attainment iff nu <= Z0, and relaxed minimizer mass min(nu,Z0)."

